services:
  mongodb:
    image: mongo:8
    container_name: eisenhower-mongodb
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: eisenhower-todo-app
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    depends_on:
      - mongodb

volumes:
  mongo-data: