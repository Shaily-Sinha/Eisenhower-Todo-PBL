name: Test, Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Get project code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python for automationTesting.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python requests package
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Start Express app and MongoDB
      - name: Start application with Docker Compose
        run: |
          docker compose up -d --build

      # 5. Wait until application becomes available
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          docker compose logs
          exit 1

      # 6. Run automated route tests
      - name: Run automated tests
        run: |
          python automationTesting.py

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERTOKEN }}" | docker login -u "${{ secrets.DOCKERUSERNAME }}" --password-stdin

      # 8. Build final Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERUSERNAME }}/eisenhower-todo-pbl:latest .

      # 9. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERUSERNAME }}/eisenhower-todo-pbl:latest